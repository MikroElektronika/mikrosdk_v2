name: Trigger Canonical Database Update

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        type: string
        description: mikroSDK release tag
        default: mikroSDK-2.13.1
      database_version:
        type: choice
        description: Database channel
        options: [Development, Experimental, Live]
        default: Development

permissions:
  contents: read

jobs:
  trigger_db_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update general_packages database
        env:
          GENERAL_PACKAGES_TOKEN: ${{ secrets.MIKROE_ACTIONS_KEY }}
        run: |
          python3 scripts/trigger_general_database_update.py \
            --channel '${{ inputs.database_version }}' \
            --sdk-version '${{ inputs.sdk_tag }}' \
            --wait
