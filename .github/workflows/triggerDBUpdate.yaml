name: Trigger Database Update in General Packages

on:
  workflow_dispatch:
    inputs:
      sdk_tag:
        type: string
        description: Provide the SDK release tag
        default: "mikroSDK-2.17.13"
      database_version:
        type: choice
        description: Database channel to update
        options: [Development, Experimental, Live]
        default: Development

permissions:
  actions: read

jobs:
  trigger-db-update:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}
          owner: MikroElektronika
          repositories: |
            general_packages
            mikrosdk_v2

      - name: Trigger centralized SDK database update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          channel="$(echo '${{ inputs.database_version }}' | tr '[:upper:]' '[:lower:]')"
          gh api --method POST repos/MikroElektronika/general_packages/dispatches \
            -f event_type=database-update \
            -f 'client_payload[request_id]=sdk-manual-${{ github.run_id }}' \
            -f 'client_payload[source_repo]=${{ github.repository }}' \
            -f 'client_payload[source_ref]=${{ github.ref_name }}' \
            -f "client_payload[channel]=$channel" \
            -f 'client_payload[operation]=sdk' \
            -f 'client_payload[core_release]=latest' \
            -f 'client_payload[core_version]=latest' \
            -f 'client_payload[sdk_version]=${{ inputs.sdk_tag }}' \
            -F 'client_payload[mcus_only]=false'
