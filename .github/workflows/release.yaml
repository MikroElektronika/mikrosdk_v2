name: Release Asset Upload

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mcu_regex:
        type: string
        description: Provide regex for which MCUs SDK support is being released
        default: "PIC18F97J94|PIC32MZ2048EFH144|STM32F429ZI"
      necto_type:
        type: choice
        description: Release to Dev or Live NECTO?
        options:
          - Dev
          - Live

jobs:
  upload-release-asset:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}
          owner: MikroElektronika
          repositories: |
            mikrosdk_v2
            general_packages
            core_packages

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install "chardet==6.0.0"
          pip install py7zr

      - name: Run Keyword Replacement Script
        ## Replace keyword 'code' with '_code' (Microchip MCUs)
        run: |
          python -u scripts/keyword_replace.py "code" "_code" "thirdparty/ethernet/cyclonetcp" "cp1252"
          python -u scripts/keyword_replace.py "code" "_code" "thirdparty/lvgl" "cp1252"

      - name: Run Package Script
        run: python -u scripts/package.py ${{ steps.app-token.outputs.token }} ${{ github.repository }} ${{ github.event.release.tag_name }} "False"

      - name: Compare Assets with Previous Release
        run: python -u scripts/compare_assets.py ${{ steps.app-token.outputs.token }} ${{ github.repository }} "--current_tag" "${{ github.event.release.tag_name }}" "--previous_tag" "latest"

      - name: Upload result_compare.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-compare
          path: result_compare.txt

  release-sdk-support:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}
          owner: MikroElektronika
          repositories: |
            general_packages

      - name: Trigger database update in general_packages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ '${{ inputs.necto_type }}' == 'Live' ]]; then
            channel=live
          else
            channel=development
          fi

          gh api --method POST \
            repos/MikroElektronika/general_packages/dispatches \
            -f event_type=database-update \
            -f 'client_payload[request_id]=sdk-support-${{ github.run_id }}' \
            -f "client_payload[channel]=$channel" \
            -f 'client_payload[operation]=devices' \
            -f 'client_payload[regex]=${{ inputs.mcu_regex }}'

      - name: Wait for centralized database update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          run_id=''
          request_id='sdk-support-${{ github.run_id }}'

          for i in {1..60}; do
            run_id="$(
              gh run list \
                --repo MikroElektronika/general_packages \
                --workflow database-external-update.yml \
                --event repository_dispatch \
                --json databaseId,displayTitle \
                --jq '.[] | select(.displayTitle | contains("'"$request_id"'")) | .databaseId' \
                | head -1
            )"

            [ -n "$run_id" ] && break

            sleep 5
          done

          [ -n "$run_id" ] || {
            echo 'Could not find central database workflow run'
            exit 1
          }

          gh run watch "$run_id" \
            --repo MikroElektronika/general_packages \
            --exit-status

      - name: Send notification to Mattermost
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL_SDK }}
        run: |
          MCU_STRING="${{ inputs.mcu_regex }}"
          NECTO_VERSION="${{ inputs.necto_type }} NECTO"

          MESSAGE="SDK Support was successfully added for the following MCUs in $NECTO_VERSION:\n$(echo "$MCU_STRING" | tr '|' '\n' | sed 's/^/- /')"

          curl --fail-with-body \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"text\": \"$MESSAGE\"}" \
            "$MATTERMOST_WEBHOOK_URL"
