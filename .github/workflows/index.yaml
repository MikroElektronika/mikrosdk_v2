name: Index Latest Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: Which release version to index (type mikroSDK-2.14.2 for example)
        default: "mikroSDK-2.17.13"
      select_index:
        type: choice
        description: Index channel
        options:
          - Test
          - Live
          - Experimental
      set_as_latest:
        type: boolean
        description: Promote selected version to latest? (Only applied if index is set to "Live")
        default: false
      keep_dates:
        type: boolean
        description: Update asset indexes for chosen tag without changing their dates? (Will update only hash values based on metadata.json)
        default: false
      skip_database_update:
        type: boolean
        description: Skip the canonical database update in general_packages?
        default: false
      notify_sdk:
        type: boolean
        description: Notify SDK
        default: false
      filter_sdk_boards:
        type: boolean
        description: Run SDK board filtering after indexing?
        default: false

jobs:
  update_database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Skip database update
        if: ${{ github.event.inputs.skip_database_update == 'true' }}
        run: echo "Skipping canonical database update."

      - name: Update canonical database in general_packages
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.keep_dates == 'false' && github.event.inputs.skip_database_update == 'false' }}
        env:
          GENERAL_PACKAGES_TOKEN: ${{ secrets.MIKROE_ACTIONS_KEY }}
        run: |
          python3 scripts/trigger_general_database_update.py \
            --channel '${{ github.event.inputs.select_index }}' \
            --sdk-version '${{ github.event.inputs.release_version }}' \
            --wait

      - name: Trigger Core schema refresh
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.keep_dates == 'false' && github.event.inputs.skip_database_update == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.MIKROE_ACTIONS_KEY }}
        run: |
          payload="$(jq -n \
            --arg version '${{ github.event.inputs.release_version }}' \
            --arg index '${{ github.event.inputs.select_index }}' \
            '{event_type:"trigger-workflow-update-database-from-sdk",client_payload:{version:$version,index:$index,branch:"main",skip_database:true}}')"
          curl --fail-with-body -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/MikroElektronika/core_packages/dispatches \
            -d "$payload"

  index:
    runs-on: ubuntu-latest
    needs: update_database

    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
          pip install aiofiles
          pip install requests
          pip install py7zr
          pip install beautifulsoup4
          pip install "chardet==6.0.0"
          pip install alive-progress
          pip install elasticsearch==7.13.4
          sudo apt-get install p7zip-full

      - name: Run Index Script - Scheduled
        if: ${{ github.event_name == 'schedule' }}
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          MIKROE_NECTO_AWS: ${{ secrets.MIKROE_NECTO_AWS }}
        run: |
          echo "Indexing to Live."
          python -u scripts/index.py ${{ github.repository }} ${{ steps.app-token.outputs.token }} "mikroSDK-2.17.4" ${{ secrets.ES_INDEX_LIVE }} "True"

      - name: Run Index Script - Manual Run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          MIKROE_NECTO_AWS: ${{ secrets.MIKROE_NECTO_AWS }}
        run: |
          if [[ ${{ github.event.inputs.select_index }} == "Live" ]]; then
            echo "Indexing to Live."
            python -u scripts/index.py \
              ${{ github.repository }} \
              ${{ steps.app-token.outputs.token }} \
              ${{ github.event.inputs.release_version }} \
              ${{ secrets.ES_INDEX_LIVE }} \
              ${{ github.event.inputs.set_as_latest }} \
              "--keep_previous_dates" \
              ${{ github.event.inputs.keep_dates }}
          elif [[ ${{ github.event.inputs.select_index }} == "Experimental" ]]; then
            echo "Indexing to Experimental."
            python -u scripts/index.py \
              ${{ github.repository }} \
              ${{ steps.app-token.outputs.token }} \
              ${{ github.event.inputs.release_version }} \
              ${{ secrets.ES_INDEX_EXPERIMENTAL }} \
              "False" \
              "--keep_previous_dates" \
              ${{ github.event.inputs.keep_dates }}
          else
            echo "Indexing to Test."
            if [[ ${{ github.event.inputs.set_as_latest }} ]]; then
              echo "Promote to latest requested, but ignored. Only available for LIVE updates."
            fi

            python -u scripts/index.py \
              ${{ github.repository }} \
              ${{ steps.app-token.outputs.token }} \
              ${{ github.event.inputs.release_version }} \
              ${{ secrets.ES_INDEX_TEST }} \
              "False" \
              "--keep_previous_dates" \
              ${{ github.event.inputs.keep_dates }}
          fi

      - name: Build SDK Message with Python
        if: ${{ github.event_name == 'schedule' || github.event.inputs.notify_sdk == 'true' }}
        run: |
          python -u scripts/build_message_sdk.py "${{ github.event.inputs.release_version }}" > message.txt

      - name: Send SDK notification to Mattermost
        if: ${{ github.event_name == 'schedule' || github.event.inputs.notify_sdk == 'true' }}
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL_SDK }}
        run: |
          MESSAGE=$(cat message.txt)
          curl -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"$MESSAGE\"}" \
            $MATTERMOST_WEBHOOK_URL

  filter_sdk_boards:
    name: Filter SDK Boards
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.filter_sdk_boards }}
    needs: index
    uses: ./.github/workflows/filterSdkBoards.yaml
    with:
      release_version: ${{ inputs.release_version }}
      notify_mattermost: true
      update_google_sheet: true
    secrets:
      MATTERMOST_WEBHOOK_URL_EW: ${{ secrets.MATTERMOST_WEBHOOK_URL_EW }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
