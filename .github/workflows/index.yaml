name: Index Latest Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: Which release version to index (type mikroSDK-2.14.2 for example)
        default: "mikroSDK-2.17.13"
      select_index:
        type: choice
        description: Index as test or live
        options:
          - Test
          - Live
          - Experimental
      set_sdk_support:
        type: boolean
        description: Set Devices.sdk_support=1 for MCUs matching the regex while indexing
        default: false
      sdk_support_regex:
        type: string
        description: MCU UID regex used when set_sdk_support is enabled
        default: ''
      set_as_latest:
        type: boolean
        description: Promote selected version to latest? (Only applied if index is set to "Live")
        default: false
      keep_dates:
        type: boolean
        description: Update asset indexes for chosen tag without changing their dates? (Will update only hash values based on metadata.json)
        default: false
      skip_database_update:
        type: boolean
        description: Skip triggering database update in general_packages?
        default: false
      filter_sdk_boards:
        type: boolean
        description: Run SDK board filtering after indexing?
        default: false

jobs:
  update_general_database:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SDK support regex
        if: ${{ inputs.set_sdk_support }}
        env:
          SDK_SUPPORT_REGEX: ${{ inputs.sdk_support_regex }}
        run: |
          python - <<'PY'
          import os, re
          regex = os.environ['SDK_SUPPORT_REGEX']
          if not regex:
              raise SystemExit('sdk_support_regex must be provided when set_sdk_support is enabled')
          re.compile(regex)
          print(f'Validated sdk_support regex: {regex}')
          PY

      - name: Skip database update
        if: ${{ inputs.skip_database_update }}
        run: echo 'Skipping general_packages database update.'

      - name: Authorize Mikroe Actions App
        if: ${{ !inputs.skip_database_update && (inputs.keep_dates == false || inputs.set_sdk_support) }}
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}
          owner: MikroElektronika
          repositories: |
            general_packages
            mikrosdk_v2

      - name: Trigger database update
        if: ${{ !inputs.skip_database_update && (inputs.keep_dates == false || inputs.set_sdk_support) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          case '${{ inputs.select_index }}' in
            Live) channel=live ;;
            Experimental) channel=experimental ;;
            *) channel=development ;;
          esac

          operation=sdk
          if [[ '${{ inputs.keep_dates }}' == 'true' ]]; then
            operation=devices
          fi

          args=(
            -f event_type=database-update
            -f 'client_payload[request_id]=sdk-${{ github.run_id }}'
            -f "client_payload[channel]=$channel"
            -f "client_payload[operation]=$operation"
            -f 'client_payload[sdk_version]=${{ inputs.release_version }}'
          )

          if [[ '${{ inputs.set_sdk_support }}' == 'true' ]]; then
            if [[ "$operation" == devices ]]; then
              args+=(
                -f 'client_payload[regex]=${{ inputs.sdk_support_regex }}'
              )
            else
              args+=(
                -F 'client_payload[set_sdk_support]=true'
                -f 'client_payload[sdk_support_regex]=${{ inputs.sdk_support_regex }}'
              )
            fi
          fi

          gh api --method POST repos/MikroElektronika/general_packages/dispatches "${args[@]}"

      - name: Wait for centralized database update
        if: ${{ !inputs.skip_database_update && (inputs.keep_dates == false || inputs.set_sdk_support) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          run_id=''
          request_id='sdk-${{ github.run_id }}'
          for i in {1..60}; do
            run_id="$(gh run list --repo MikroElektronika/general_packages --workflow database-external-update.yml --event repository_dispatch --json databaseId,displayTitle --jq '.[] | select(.displayTitle | contains("'"$request_id"'")) | .databaseId' | head -1)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo 'Could not find central database workflow run'; exit 1; }
          gh run watch "$run_id" --repo MikroElektronika/general_packages --exit-status

  index:
    runs-on: ubuntu-latest
    needs: update_general_database

    steps:
      - name: Authorize Mikroe Actions App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.MIKROE_ACTIONS }}
          private-key: ${{ secrets.MIKROE_ACTIONS_KEY_AUTHORIZE }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp
          pip install aiofiles
          pip install requests
          pip install py7zr
          pip install beautifulsoup4
          pip install "chardet==6.0.0"
          pip install alive-progress
          pip install elasticsearch==7.13.4
          sudo apt-get install p7zip-full

      - name: Run Index Script - Scheduled
        if: ${{ github.event_name == 'schedule' }}
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          MIKROE_NECTO_AWS: ${{ secrets.MIKROE_NECTO_AWS }}
        run: |
          echo "Indexing to Live."
          python -u scripts/index.py ${{ github.repository }} ${{ steps.app-token.outputs.token }} "mikroSDK-2.17.4" ${{ secrets.ES_INDEX_LIVE }} "True"

      - name: Run Index Script - Manual Run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ES_HOST: ${{ secrets.ES_HOST }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          MIKROE_NECTO_AWS: ${{ secrets.MIKROE_NECTO_AWS }}
        run: |
          if [[ '${{ github.event.inputs.select_index }}' == 'Live' ]]; then
            echo 'Indexing to Live.'
            target_index='${{ secrets.ES_INDEX_LIVE }}'
            promote='${{ github.event.inputs.set_as_latest }}'
          elif [[ '${{ github.event.inputs.select_index }}' == 'Test' ]]; then
            echo 'Indexing to Test.'
            target_index='${{ secrets.ES_INDEX_TEST }}'
            promote='False'
          else
            echo 'Indexing to Experimental.'
            target_index='${{ secrets.ES_INDEX_EXPERIMENTAL }}'
            promote='False'
          fi

          python -u scripts/index.py \
            '${{ github.repository }}' \
            '${{ steps.app-token.outputs.token }}' \
            '${{ github.event.inputs.release_version }}' \
            "$target_index" \
            "$promote" \
            '--keep_previous_dates' \
            '${{ github.event.inputs.keep_dates }}'

  filter_sdk_boards:
    name: Filter SDK Boards
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.filter_sdk_boards }}
    needs: index
    uses: ./.github/workflows/filterSdkBoards.yaml
    with:
      release_version: ${{ inputs.release_version }}
      notify_mattermost: true
      update_google_sheet: true
    secrets:
      MATTERMOST_WEBHOOK_URL_EW: ${{ secrets.MATTERMOST_WEBHOOK_URL_EW }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
